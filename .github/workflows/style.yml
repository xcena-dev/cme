# Style gates: clang-format and clang-tidy, both over the whole tree.
#
# Both are clean everywhere, so drift anywhere fails and neither gate depends on what a
# particular change touched. Two things a diff-scoped tidy could not see: moving a definition
# makes another file a violation without that file appearing in the diff, and a push has no base
# commit to diff against, so its checked line count was zero.
#
# tidy is two steps because a whole-tree sweep is not the same as every file. The compile database
# holds translation units, so a header is checked only where it is included, and a diagnostic about
# the header's own includes is attributed to the .cpp instead. The second step passes headers
# directly, which is the only way one is the file under diagnosis.
#
# Neither job rewrites the branch. A gate that pushes commits the author did not write races
# with their next push and needs write access on forks, which is a bigger cost than running
# one command locally.
#
# Both installs bound the dpkg lock wait. The hosted image runs its own apt timers shortly after
# boot, and apt-get waits for that lock unbounded by default, so contention reads as a hang.

name: style

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The version is pinned because clang-format's output changes between major releases.
      # 18 and 21 agree on this tree today -- ColumnLimit: 0 means it never reflows, which is
      # where most of the inter-version difference lives -- but that is a fact about the
      # current config, not a guarantee.
      - name: Install clang-format
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=180 update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y clang-format-18

      - name: Check formatting
        run: |
          mapfile -t files < <(find include common src tests tools examples daemon -name '*.cpp' -o -name '*.hpp')
          echo "checking ${#files[@]} files"
          if ! clang-format-18 --dry-run -Werror "${files[@]}"; then
            echo
            echo "Run this, then commit the result:"
            echo "  find include common src tests tools examples daemon -name '*.cpp' -o -name '*.hpp' | xargs clang-format-18 -i"
            exit 1
          fi

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # run-clang-tidy ships inside the clang-tidy-18 package and drives clang-tidy over every
      # entry in the compile database. It is a python script, and the hosted image carries python3.
      - name: Install clang-tidy
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=180 update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y clang-tidy-18 cmake ninja-build

      # Configure only. clang-tidy needs compile_commands.json, not object files, and this
      # tree generates no headers, so nothing has to be built first. A missing config.yaml is
      # not an error: cme_site_config_load returns early and every consumer falls back to a
      # value that disables the feature.
      # Both failpoint axes on, so the halves they gate reach the database. Without them the analyzer
      # sees an empty file where each mechanism lives, and every finding in one goes unreported.
      - name: Generate the compile database
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCME_FAILPOINT=ON -DCMED_FAILPOINT=ON

      # Every translation unit the database carries.
      #
      # -j 4 is the hosted runner's core count, not a guess at another machine's: a fixed number is
      # what makes the wall time predictable, and the whole tree is minutes here rather than the
      # seconds a diff took.
      - name: Check every translation unit
        run: |
          run-clang-tidy-18 -p build -j 4 -quiet -use-color 2>&1 | tee tidy.log
          if grep -q 'warning:' tidy.log; then
            echo
            echo "The tree must satisfy /.clang-tidy. Reproduce with:"
            echo "  cmake -S . -B build -G Ninja && run-clang-tidy-18 -p build -quiet"
            exit 1
          fi

      # A header is nobody's translation unit, so the database has no entry for one and the step
      # above never diagnoses a header as the file it is parsing. include-cleaner reports a missing
      # include against the file being compiled, so a header's own missing include lands on the .cpp
      # that included it and is attributed there; -header-filter does not change that. Passing each
      # header directly is what checks it, and it is also why the flags are spelled out -- there is
      # no database entry to take them from. They have to be the ones the build uses: the analyzer
      # reports an uninitialized va_list in three correct varargs helpers when NDEBUG is absent, so
      # a step that dropped the Release flags would diagnose code nothing compiles that way.
      - name: Check every header
        run: |
          mapfile -t headers < <(find include common src tests tools examples daemon -name '*.hpp')
          echo "checking ${#headers[@]} headers"
          clang-tidy-18 -p build --quiet -use-color "${headers[@]}" -- \
              -std=c++17 -O2 -DNDEBUG \
              -I"$PWD/include" \
              -I"$PWD/common" \
              -I"$PWD/src" \
              -I"$PWD/tests/harness" \
              -I"$PWD/daemon" \
              -I"$PWD/daemon/shared/include" \
              -I"$PWD/daemon/client/include" \
              -I"$PWD/daemon/tests" 2>&1 | tee headers.log
          if grep -q 'warning:' headers.log; then
            echo
            echo "A header must satisfy /.clang-tidy on its own, not only where it is included."
            exit 1
          fi
