# The third of the suite a hosted runner can prove.
#
# GitHub Actions has no devdax node and no uncacheable mount, so the dax and uc registrations
# would report skipped here and prove nothing. This runs the shm label, which covers every case
# that does not need the hardware. How many that is belongs to the run rather than to this
# comment: the Report what ran step below prints it, and a count written here goes stale the
# next time a case is added. tests/local_ci.sh runs the whole of it on a machine that has the
# media, and treats a missing medium as a failure rather than a skip.
#
# tests/baseline is not here either: it needs a second host over RoCE.

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The lock wait is bounded because the hosted image runs its own apt timers shortly after boot,
      # and apt-get waits for that lock without a bound by default, so contention reads as a hang.
      - name: Install the toolchain
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=180 update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y cmake ninja-build g++

      # No config.yaml: it is per-machine and gitignored, and a missing one is not an error.
      # cme_site_config_load returns early, so the dax device and the uncacheable mount both
      # read as absent -- which on this runner is the truth.
      # Both failpoint axes on: without them the boundary cases register as skipped, and a skip on
      # the gate proves nothing about a crash boundary. Off by default, since neither is a shipping
      # feature and every reach() they compile in is dead weight to a deployment.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCME_FAILPOINT=ON -DCMED_FAILPOINT=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Serial. A gate that flakes is not a gate, and these cases contend on purpose: several
      # of them assert a fairness bound or a bounded wait that a loaded box can miss.
      #
      # Named by what this runner cannot reach rather than by what it can: a case with no medium
      # carries no label at all, and a selector that lists media drops it.
      - name: Run everything but dax and uc
        run: ctest --test-dir build -LE 'dax|uc' --output-on-failure

      - name: Report what ran
        if: always()
        run: ctest --test-dir build -N -LE 'dax|uc' | tail -1
