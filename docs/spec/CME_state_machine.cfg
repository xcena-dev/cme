\* TLC safety configuration for CME_state_machine.tla -- checks the report's §4 core state
\* machine directly (belief, epochs, control/data, create/delete, shadow are out of scope).

SPECIFICATION Spec
CHECK_DEADLOCK TRUE

CONSTANTS
    NumPeers   = 4
    NumDomains = 2

\* Structural safety: DomainRecord is a total single-valued function from domains to peers.
INVARIANT TypeOK

\* I1: a dead owner stays pending recovery until its domains are transferred -- authority never strands.
INVARIANT DeadHolderPending

\* A Recovering slot always denotes a dead target.
INVARIANT RecoveringTargetsDead

\* RA uniqueness is not represented here: recovery steps may be performed by any active peer,
\* so TLC checks safety independent of the performer. LWW single-winner correctness is a
\* separate policy-layer obligation.